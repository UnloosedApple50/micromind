[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "micromind"
version = "1.0.0"
description = "Agente empresarial ultraleve com capacidades de IA desacopladas"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
authors = [
    { name = "MicroMind Team" },
]
keywords = [
    "enterprise",
    "agent",
    "ai",
    "automation",
    "telephony",
    "lightweight",
    "offline",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

# Core dependencies (required for all profiles)
dependencies = []

[project.optional-dependencies]
# LOW profile and above
cli = [
    "typer>=0.9.0",
    "rich>=13.0.0",
]
# STANDARD profile and above
standard = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "pyyaml>=6.0",
    "httpx>=0.24.0",
]
# HIGH profile and above
high = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "pyyaml>=6.0",
    "httpx>=0.24.0",
    "ollama>=0.1.0",
]
# SERVER profile
server = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "pyyaml>=6.0",
    "httpx>=0.24.0",
    "ollama>=0.1.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
]
# Development
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "mypy>=1.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
micromind = "micromind.cli:main"

[project.urls]
Homepage = "https://github.com/micromind/micromind"
Documentation = "https://github.com/micromind/micromind/docs"
Repository = "https://github.com/micromind/micromind.git"
Issues = "https://github.com/micromind/micromind/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/micromind"]

[tool.hatch.build.targets.sdist]
include = [
    "src/micromind",
    "tests",
    "benchmarks",
    "docs",
    "README.md",
    "LICENSE",
    ".env.example",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--verbose",
    "--tb=short",
]

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
exclude = [
    "tests/",
    "benchmarks/",
]

[tool.ruff]
line-length = 100
target-version = "py38"
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "D",   # pydocstyle
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = [
    "D100",  # Missing docstring in public module
    "D104",  # Missing docstring in public package
    "D203",  # 1 blank line required before class docstring
    "D213",  # Multi-line docstring summary should start at the second line
]

[tool.ruff.pydocstyle]
convention = "google"

[tool.ruff.isort]
known-first-party = ["micromind"]

[tool.coverage.run]
source = ["src/micromind"]
branch = true
omit = [
    "tests/*",
    "benchmarks/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
show_missing = true
fail_under = 80
